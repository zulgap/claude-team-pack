name: skill-ownership-gate

# 목적: "만든 사람이 정본 소유자"(2026-08-04 확정)를 사람의 기억이 아니라 코드가 집행한다.
#
# 왜 CODEOWNERS 가 아닌가:
#   GitHub 이 이 레포에서 CODEOWNERS 를 읽지 않는다 (2026-08-05, 4회 실측 — CHANGELOG v2.28).
#   리뷰어 자동 지정 0건 + code owner 승인 요구가 머지를 막지 않았다. 원인 미상.
#   조직(Organization) 으로 옮기면 재시험 대상이지만, 그때까지는 이 게이트가 유일한 집행 수단이다.
#
# 무엇을 하나:
#   PR 이 남의 스킬 본체를 건드렸으면 그 소유자의 **승인**을 요구한다(차단이 아니다).
#   PR 을 올린 사람이 레포 주인이면 통과한다(정책 ③ 비대칭 — 사장님만 예외).
#
# 🔴 fetch-depth: 0 이 필수다.
#    actions/checkout 기본값은 shallow(depth 1) 라 `git log` 로 최초 작성자를 못 찾는다.
#    이 한 줄이 없으면 게이트가 전원 통과하거나 전원 실패한다.
#
# 🔴 pull_request_review 트리거가 필수다.
#    PR 을 처음 열 땐 아직 승인이 없어 이 검사가 실패하는 게 정상이다.
#    소유자가 승인을 눌렀을 때 다시 돌아야 초록불이 된다.

on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  actions: write        # 승인 후 «옛 실패 기록»을 지우는 데 필요하다 (아래 마지막 스텝 참조)

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 최초 작성자 조회에 전체 이력이 필요하다 (위 주석 참조)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 스킬 소유권 게이트
        id: gate
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if node scripts/check-skill-ownership.js; then
            echo ""
            echo "✅ 스킬 소유권 확인 완료."
          else
            echo ""
            echo "::error::남의 스킬 본체를 고쳤습니다. 위 안내대로 소유자 승인을 받아 주세요."
            echo "  막는 것이 아니라 승인이 필요하다는 뜻입니다 — 승인이 등록되면 자동으로 다시 돕니다."
            exit 1
          fi

      # @AI:INTENT 게이트가 「@누구 승인이 필요하다」를 알아내고도 **그 사람에게 도달하지 않았다**.
      #   실사고(2026-08-14): PR #183·#184 가 반나절 멈춰 있었는데 소유자는 자기 차례인 줄 몰랐다.
      #   pr-notify 는 「올라왔습니다」만 말하고 누구 차례인지는 말하지 않는다.
      # 🔴 승인 이벤트에는 보내지 않는다 — 승인 직후 다른 소유자 대기로 또 실패하면 연쇄 발송이 된다.
      #   CLAUDE.md 원칙: 알림은 늘리는 것이 아니라 줄이는 것이 도달을 만든다.
      # @AI:DEPENDS 발송 패턴(파일 경유 + ok:true 판정)의 SSOT 는 `pr-notify.yml` 이다.
      #   한글이 인자로 넘어가면 CP949 로 깨져 텔레그램이 거부한 실측이 있어 그 방식을 따른다.
      #   🔑 같은 패턴이 **3번째** 생기면 그때 공통 스크립트로 뺄 것(지금은 2곳이라 분리가 더 비싸다).
      - name: 승인 필요 알림 (팀챗)
        if: failure() && steps.gate.outputs.pending_owners != '' && github.event_name == 'pull_request'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: '-5453618406'          # 줄갭-클로드(내부개발소통) — pr-notify 와 같은 방
          OWNERS: ${{ steps.gate.outputs.pending_owners }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -o pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN 이 없어 알림을 못 보냈습니다 — 소유자에게 직접 알려주세요."
            exit 0
          fi
          MSG="${RUNNER_TEMP:-/tmp}/ownership-notify.txt"
          printf '%s\n%s\n%s\n%s\n%s' \
            "🔑 PR #${PR_NUM} — ${OWNERS} 승인 필요" \
            "${PR_TITLE}" \
            "본인이 만든 스킬을 남이 고쳤습니다. 승인해야 진행됩니다." \
            "Files changed → Review changes → Approve" \
            "${PR_URL}" > "$MSG"
          RESP=$(curl -sS -m 15 -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text@${MSG}") || RESP=''
          # @AI:CONSTRAINT 알림 실패가 게이트 판정을 뒤집지 않는다 — 이 스텝은 이미 실패한 PR 의
          #   부가 안내다. 여기서 죽으면 「왜 실패했는지」가 로그에서 밀려난다.
          if printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "알림 발송 — PR #${PR_NUM} → ${OWNERS}"
          else
            echo "::warning::팀챗 알림 실패 — ${OWNERS} 에게 직접 알려주세요."
            printf '%s' "$RESP" | head -c 300
          fi

      # @AI:INTENT 승인을 받아 초록이 됐는데도 «머지가 안 풀리는» 문제를 없앤다.
      #   실사고(2026-08-19 PR #239): 소유자 승인 → 이 게이트 재실행 → SUCCESS 인데
      #   머지 상태가 계속 BLOCKED 였다. 원인은 **같은 커밋에 결과가 둘**이라는 것 —
      #   처음 열었을 때의 FAILURE(pull_request) 와 승인 후의 SUCCESS(pull_request_review) 가
      #   함께 남아, 브랜치 보호가 옛 실패를 계속 본다(실측: head_sha 98f378cd 에 둘 다 존재).
      #   위 주석의 *"승인이 등록되면 자동으로 다시 돌아 초록이 된다"* 는 **초록까지만 맞고
      #   차단 해제는 안 됐다.** 그날은 빈 커밋을 하나 밀어 잔상을 지웠지만, 그건 사람이 매번 해야 한다.
      # @AI:CONSTRAINT 🔴 «통과했을 때만» 지운다 — 실패 상태에서 지우면 증거 인멸이다.
      #   `success()` 가 그 잠금이고, 조건을 넓히지 말 것.
      # @AI:CONSTRAINT 지우는 대상은 **같은 커밋(head_sha)·같은 워크플로우·conclusion=failure** 뿐이다.
      #   다른 커밋의 이력은 그 커밋의 판정 근거라 남긴다. 자기 자신(run_id)도 제외한다.
      # 🔑 사라지는 로그는 「승인 전이라 실패」라는 자명한 내용이고, 지금 SUCCESS 가 그 자리를 대신한다.
      - name: 승인 후 옛 실패 기록 정리
        if: success() && github.event_name == 'pull_request_review'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.run_id }}
        run: |
          set -o pipefail
          STALE=$(gh api "repos/${TARGET_REPO}/actions/workflows/skill-ownership.yml/runs?head_sha=${SHA}&per_page=100" \
            --jq ".workflow_runs[] | select(.conclusion==\"failure\") | select(.id != ${SELF}) | .id") || STALE=''
          if [ -z "$STALE" ]; then
            echo "정리할 옛 실패 기록 없음 — 이 커밋의 첫 판정입니다."
            exit 0
          fi
          for id in $STALE; do
            if gh api -X DELETE "repos/${TARGET_REPO}/actions/runs/${id}" >/dev/null 2>&1; then
              echo "옛 실패 기록 삭제 — run ${id} (승인 전 판정)"
            else
              # @AI:CONSTRAINT 정리 실패가 게이트 판정을 뒤집지 않는다 — 승인은 이미 확인됐다.
              #   여기서 죽으면 통과한 PR 이 실패로 보인다.
              echo "::warning::run ${id} 삭제 실패 — 머지가 안 풀리면 빈 커밋을 하나 밀어 주세요."
            fi
          done
