name: pr-telegram-notify

# 목적: PR 이 올라오거나 처리되면 팀챗(줄갭-클로드 내부개발소통)에 알린다.
#
# 왜 만들었나 (2026-08-08):
#   zulgap-make-skill/SKILL.md 가 직원에게 *"PR 이 올라가면 자동으로 알림이 간다 —
#   따로 알릴 필요 없다"* 고 안내해 왔는데 **그 경로가 존재한 적이 없었다.**
#   실측 — 이 레포 워크플로우 3개·팀팩 스킬·백엔드 webhook 전부 0건, 팀챗 8월 봇 발신 0건.
#   손으로 알린 PR(#71·#82·#83·#84)만 제때 처리됐고 #103·#127 은 아무도 모른 채 지나갔다.
#   문서가 "알릴 필요 없다"고 지시했기 때문에 **침묵이 능동적으로 만들어졌다.**
#
# 🔴 continue-on-error 를 붙이지 말 것.
#    발송 실패가 조용하면 이 배선은 «있는데 안 도는» 상태로 또 두 달을 간다.
#    실패는 PR 화면의 빨간불로 보여야 한다 — 그게 이 워크플로우의 관측 설계 전부다.
#
# 🔴 PR 제목·작성자를 run: 본문에 ${{ }} 로 직접 넣지 말 것.
#    이 레포는 public 이라 아무나 PR 을 열 수 있고, 제목에 $(...) 나 백틱을 넣으면
#    러너에서 그대로 실행된다. 그 러너는 봇 토큰 secret 을 쥐고 있다.
#    → 전부 env: 로 넘기고 "$VAR" 로만 쓴다. 전송은 --data-urlencode 로 셸 보간 없이.
#
# 🔴 actions/checkout 을 추가하지 말 것 (설계 조건).
#    알림에 필요한 것은 이벤트 페이로드뿐이다. 체크아웃하면 PR 브랜치의 코드가
#    secret 을 쥔 러너에서 돌 여지가 생긴다. 이 job 은 저장소 내용을 보지 않는다.
#
# 알림이 안 오는 경우는 셋이고 성격이 다르다:
#    ① 레포 주인 PR        → 정상. 의도적으로 보내지 않는다 (아래 if: 주석 참조)
#    ② draft 로 연 PR      → 정상. ready_for_review 때 알린다 (job skip = 회색)
#    ③ 토큰 미등록·API 실패 → 장애 (빨간불). 실패 메시지에 사유를 적는다
#
#    ⚠️ fork PR 은 여기 해당하지 않는다 — 아래 pull_request_target 이라 secret 이
#       전달되어 정상 발송된다. (트리거를 pull_request 로 되돌리면 이 항목이 부활한다)
#
#    ⚠️ 알려진 결함(2026-08-16 실측, 이번에 고치지 않음) — 아래 `branches: [main]` 때문에
#       **스택 PR 의 「열림」은 알림이 안 간다.** PR-2 를 PR-1 브랜치 위에 열면 base 가 main 이
#       아니라 필터에 걸리고, 앞 PR 이 머지될 때 base 가 main 으로 자동 변경되어 「머지」만 온다.
#       실측: #191~194 가 그 형태였다(타임라인 base_ref_changed). 팀원은 스택 PR 을 쓰지 않아
#       지금은 드러나지 않지만, 쓰기 시작하면 그 PR 은 조용히 묻힌다.

# 🔴 pull_request 가 아니라 pull_request_target 이다.
#    pull_request 는 **PR 브랜치의** 워크플로우를 실행한다 → 팀원이 이 파일을 고친 PR 을
#    열면 그 수정본이 러너에서 돌고, 그 러너는 봇 토큰 secret 을 쥔다(레포가 public 이라
#    write 권한자 누구나 가능). pull_request_target 은 **base(main) 의** 워크플로우를
#    실행하므로 PR 이 이 파일을 어떻게 고쳐도 여기 적힌 내용만 돈다.
#
#    이 트리거는 보통 위험하다고 알려져 있는데 그건 **PR 코드를 체크아웃해 실행할 때**다.
#    이 job 은 actions/checkout 이 없고 이벤트 페이로드만 쓴다 — 그래서 안전한 쪽에 속한다.
#    (위 「actions/checkout 을 추가하지 말 것」 주석이 이제 보안 요건이 됐다.)
#
#    ⚠️ 대신 fork PR 에도 secret 이 전달되어 알림이 간다. 외부 기여가 0 이라 수용한다.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # 🔴 레포 주인(사장님)이 올린 PR 은 보내지 않는다 — 2026-08-16 사장님 확정.
    #    사장님 지시: *"pr메시지가 두번씩 오고 또 너무 많이 오니 우리팀원들이 오히려 잘 안보게됩니다.
    #    꼭 팀원들이 봐야할것만 보내는게 맞을듯합니다."*
    #
    #    실측(8/8~8/15, 8일): PR 53건 중 **47건(89%)이 레포 주인** 것이었고, 여기에 서버 웹훅
    #    중복(judgmentos/routes/github-webhook.js)까지 겹쳐 **한 방에 165건 = 하루 21건**이 쌓였다.
    #    사장님이 올려 사장님이 머지하는 PR 에 팀원이 할 일은 없다.
    #
    #    이 배선의 원래 목적은 **팀원 PR 이 묻히는 것**(#103·#127)을 막는 것이었다.
    #    그 6건을 살리려고 47건을 함께 보내던 상태를 되돌린다 — 목적은 그대로 두고 잡음만 뺀다.
    #    🔴 되살리기 전에 물을 것: "이거 팀원이 손을 써야 하는 일인가?" 아니면 보내지 않는다.
    #
    # ⚠️ 판정축은 author_association 이다(실측: 사장님 OWNER / 팀원 COLLABORATOR).
    #    이 레포가 **조직 소유로 이관되면 OWNER 가 사라져** 전원이 MEMBER 가 되고 알림이 다시
    #    폭증한다. 조용한 실패가 아니라 시끄러운 실패라 발견은 되지만, 이관 시 이 줄을 함께 고칠 것.
    #
    # draft 는 ready_for_review 때 알린다. 단 closed 는 draft 였어도 결과를 알린다.
    if: >-
      github.event.pull_request.author_association != 'OWNER'
      && (github.event.pull_request.draft == false || github.event.action == 'closed')
    steps:
      - name: 팀챗 발송
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: '-5453618406'          # 줄갭-클로드(내부개발소통)
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret 이 없습니다."
            echo "::error::등록 위치 — Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          if [ "$ACTION" = "closed" ]; then
            if [ "$MERGED" = "true" ]; then
              HEAD="✅ PR #${PR_NUM} 머지됐습니다"
            else
              HEAD="🚫 PR #${PR_NUM} 닫혔습니다 (머지 안 됨)"
            fi
          else
            HEAD="🆕 PR #${PR_NUM} 올라왔습니다"
          fi

          # printf 로 조립한다 — heredoc/들여쓰기는 본문에 공백을 섞는다.
          # parse_mode 는 쓰지 않는다: PR 제목에 _ * ( 가 흔해 Markdown 파싱 오류로 발송이 죽는다.
          #
          # 🔴 본문을 파일에 쓰고 text@파일 로 보낸다 — 명령줄 인자로 넘기지 않는다.
          #    2026-08-08 실측: 개발 PC(Git Bash)에서 같은 문자열을 인자로 넘기면 텔레그램이
          #    `Bad Request: strings must be encoded in UTF-8` 로 거부했다. 이모지는 통과하는데
          #    **한글만** 깨졌다(CP949 로 변환되기 때문. 이모지는 CP949 에 없어 UTF-8 로 살아남는다).
          #    파일은 바이트 그대로 실려 같은 문자열이 성공했다. 러너는 UTF-8 이라 인자로도
          #    될 가능성이 높지만, **깨지는 것을 실제로 본 이상 추정에 기대지 않는다.**
          MSG="${RUNNER_TEMP:-/tmp}/pr-notify-msg.txt"
          printf '%s\n%s\n%s\n%s' "$HEAD" "$PR_USER" "$PR_TITLE" "$PR_URL" > "$MSG"

          RESP=$(curl -sS -m 15 -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text@${MSG}")

          # 텔레그램은 HTTP 200 으로도 실패를 돌려준다 — 상태코드가 아니라 본문으로 판정한다.
          if ! printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "::error::텔레그램 발송 실패 — 방에 알림이 가지 않았습니다. 직접 알려주세요."
            printf '%s' "$RESP" | head -c 500
            exit 1
          fi

          echo "발송 성공 — PR #${PR_NUM} (${ACTION})"
