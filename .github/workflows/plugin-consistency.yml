name: plugin-consistency-gate

# 목적: scripts/check-plugin-consistency.js 를 CI에서 강제한다.
#
# 왜 필요한가 (2026-07-30 5인검증 실측):
#   게이트가 보는 규칙 = 12/12 = 100% 준수
#   사람 눈만 보는 규칙 = 8% 준수
#   같은 repo·같은 사람·같은 문서인데 갈린 유일한 차이가 "검사하는 코드가 있는가"였다.
#
#   더 아픈 것: 이 체커는 2026-07-22에 이미 만들어져 있었는데 **CI에 안 걸려 있어서**
#   PR #53(dev-pack role 조건부화) 이후 자기 자신이 6개 PR 동안 적색 방치됐다.
#   → 게이트를 만드는 것보다 **자동으로 돌게 하는 것**이 결정적이다.
#
# 검사 내용 (Tier A~F):
#   A 활성화 집합 — marketplace.json ↔ install.ps1 / install.sh / hook-doctor-v2.js 4장부 일치
#   B 레거시 잔존 — deprecated 플러그인 이름이 활성화 경로에 남지 않았나
#   C 스킬 이름   — kebab-case 규격 · 폴더명==name · 플러그인 내/간 명령 충돌
#   D tier·A급    — tier 전수 선언 + shared 스킬의 테넌트 리터럴(노션ID·UUID·UNC·PC경로) 0건
#   E 형제폴더    — SKILL.md의 `../<스킬이름>/` 하드코딩 0건 (팀팩/개인 폴더명 상이로 한쪽만 깨지는 사고)
#   F 이식성      — scripts/ 안 OS 종속 단일경로 0 + 번들 폰트 라이선스 사본 (A~E가 SKILL.md만 보는 사각지대)
# 🔴 Tier 신설 시 이 목록 + step 이름 + 성공 echo 3곳을 **함께** 갱신할 것 — 게이트 본체만 고치면
#    초록불이 "Tier A~D 전부 통과" 같은 **사실과 다른 문장**을 계속 인쇄한다(v2.23에서 실제 발생).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 플러그인·스킬 일관성 게이트 (Tier A~F)
        shell: bash
        run: |
          set -o pipefail
          if node scripts/check-plugin-consistency.js; then
            echo ""
            echo "✅ Tier A~F 전부 통과."
          else
            echo ""
            echo "::error::플러그인·스킬 일관성 게이트 실패. 위 FAIL 라인의 안내대로 고친 뒤 다시 커밋하세요."
            echo "  로컬 재현: node scripts/check-plugin-consistency.js"
            exit 1
          fi

      # 2026-08-04 신설. hook-doctor-v2 maybeRefresh()가 '갱신 실패를 실패로 기록하는가'를 잠근다.
      # 이 파일이 없던 동안 사장님 PC가 12커밋 뒤처진 채 방치됐고, 그 안에 팀원 신규 스킬 2종이 있었다.
      # 특히 S3(명령은 0 리턴인데 버전 불일치 = 무증상 실패)가 그 사고의 재현 케이스다 — 이게 깨지면 머지 금지.
      - name: 갱신 실패 가시화 회귀 테스트 (maybeRefresh S1~S8)
        shell: bash
        run: |
          set -o pipefail
          if node scripts/test-plugin-refresh.js; then
            echo ""
            echo "✅ 갱신 실패 가시화 17개 assertion 통과."
          else
            echo ""
            echo "::error::갱신 실패 가시화 회귀. 특히 S3가 깨졌다면 '무증상 실패'를 다시 못 잡는 상태입니다."
            echo "  로컬 재현: node scripts/test-plugin-refresh.js"
            exit 1
          fi
